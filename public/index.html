<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 2026 Sweepstake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1a;
      --bg-card: #111826;
      --bg-card-2: #171f2e;
      --border: rgba(255,255,255,0.07);
      --border-bright: rgba(255,255,255,0.14);
      --text: #f0f2f5;
      --text-muted: #8a93a6;
      --text-dim: #4a5568;
      --accent: #e8c547;
      --accent-dim: rgba(232,197,71,0.12);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.1);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.1);
      --tier1: #f59e0b;
      --tier1-dim: rgba(245,158,11,0.12);
      --tier2: #60a5fa;
      --tier2-dim: rgba(96,165,250,0.12);
      --tier3: #94a3b8;
      --tier3-dim: rgba(148,163,184,0.1);
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── HEADER ── */
    .site-header {
      border-bottom: 0.5px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .logo span { color: var(--text); }
    .live-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .live-dot::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .live-dot.live::before { background: var(--green); animation: blink 1.4s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── LAYOUT ── */
    .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 2rem;
      border-bottom: 0.5px solid var(--border);
    }
    .tab {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -0.5px;
      transition: color 0.15s;
      letter-spacing: 0.2px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .panel { display: none; }
    .panel.active { display: block; }

    /* ── ENTER ── */
    .enter-wrap {
      max-width: 440px;
      margin: 3rem auto;
      text-align: center;
    }
    .enter-hero {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      line-height: 1;
      letter-spacing: 1px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .enter-hero span { color: var(--accent); }
    .enter-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .tier-explainer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 2rem;
    }
    .tier-pill {
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      text-align: center;
    }
    .t1 { background: var(--tier1-dim); color: var(--tier1); border: 0.5px solid rgba(245,158,11,0.2); }
    .t2 { background: var(--tier2-dim); color: var(--tier2); border: 0.5px solid rgba(96,165,250,0.2); }
    .t3 { background: var(--tier3-dim); color: var(--tier3); border: 0.5px solid rgba(148,163,184,0.15); }

    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .text-input {
      flex: 1;
      padding: 11px 14px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: var(--bg-card);
      border: 0.5px solid var(--border-bright);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .text-input:focus { border-color: var(--accent); }
    .text-input::placeholder { color: var(--text-dim); }
    .btn {
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      background: var(--accent);
      color: #0a0f1a;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .alert {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 12px;
      text-align: left;
    }
    .alert-error { background: var(--red-dim); color: var(--red); border: 0.5px solid rgba(248,113,113,0.2); }
    .alert-success { background: var(--green-dim); color: var(--green); border: 0.5px solid rgba(74,222,128,0.2); }

    /* ── DRAW ANIMATION ── */
    .draw-box {
      background: var(--bg-card);
      border: 0.5px solid var(--border-bright);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: left;
    }
    .draw-title {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .draw-step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .draw-step:last-child { border-bottom: none; }
    .step-indicator {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1.5px solid var(--border-bright);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .step-indicator.done { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    .step-indicator.active { border-color: var(--accent); color: var(--accent); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .step-label { font-size: 13px; color: var(--text-muted); transition: color 0.3s; }
    .step-label.done { color: var(--text); font-weight: 500; }

    /* ── MY PICKS ── */
    .picks-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .picks-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1.5px solid rgba(232,197,71,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }
    .picks-name { font-size: 17px; font-weight: 600; }
    .picks-sub { font-size: 12px; color: var(--text-muted); }

    .pick-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s;
    }
    .pick-card:hover { border-color: var(--border-bright); }
    .pick-flag { font-size: 28px; line-height: 1; }
    .pick-info { flex: 1; }
    .pick-name { font-size: 16px; font-weight: 500; }
    .pick-name.elim { text-decoration: line-through; color: var(--text-dim); }
    .pick-group { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .tier-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .tb1 { background: var(--tier1-dim); color: var(--tier1); }
    .tb2 { background: var(--tier2-dim); color: var(--tier2); }
    .tb3 { background: var(--tier3-dim); color: var(--tier3); }
    .status-tag {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .status-in { background: var(--green-dim); color: var(--green); }
    .status-out { background: var(--red-dim); color: var(--red); }

    /* ── ENTRIES ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }
    .stat-num { font-size: 28px; font-weight: 600; color: var(--text); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .entries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }
    .entry-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }
    .entry-card.out { opacity: 0.55; }
    .entry-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 0.5px solid var(--border);
    }
    .e-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--bg-card-2);
      border: 0.5px solid var(--border-bright);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .e-name { font-size: 14px; font-weight: 500; }
    .e-status { font-size: 11px; color: var(--text-muted); }
    .e-teams { display: flex; flex-direction: column; gap: 6px; }
    .e-team-row { display: flex; align-items: center; gap: 8px; }
    .e-flag { font-size: 16px; }
    .e-tname { font-size: 13px; flex: 1; }
    .e-tname.elim { text-decoration: line-through; color: var(--text-dim); }

    /* ── MATCHES ── */
    .matches-section { margin-bottom: 2rem; }
    .matches-section h3 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .match-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .match-date { color: var(--text-muted); min-width: 60px; font-size: 12px; }
    .match-teams { flex: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .match-team { font-weight: 500; }
    .match-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--accent);
      min-width: 36px;
      text-align: center;
    }
    .match-vs { color: var(--text-dim); font-size: 11px; }
    .match-status { font-size: 11px; color: var(--text-muted); min-width: 50px; text-align: right; }
    .match-status.live-status { color: var(--green); }

    .no-data {
      text-align: center;
      padding: 3rem 0;
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.8;
    }

    /* ── GROUPS ── */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
    }
    .group-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .group-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .g-team {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 0.5px solid var(--border);
      font-size: 13px;
    }
    .g-team:last-child { border-bottom: none; }
    .g-flag { font-size: 15px; }
    .g-name { flex: 1; }
    .g-name.elim { text-decoration: line-through; color: var(--text-dim); }
    .g-tier { font-size: 10px; color: var(--text-dim); }

    /* ── ADMIN ── */
    .admin-wrap { max-width: 600px; }
    .admin-section { margin-bottom: 2rem; }
    .admin-section h3 { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
    .team-checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 6px;
      margin-bottom: 1rem;
    }
    .team-check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.15s;
    }
    .team-check:hover { border-color: var(--border-bright); }
    .team-check input[type=checkbox] { accent-color: var(--accent); }
    .admin-token-row { display: flex; gap: 8px; margin-bottom: 1rem; }
    .admin-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.6; }

    /* ── LOADING ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border-bright);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 2rem auto;
    }

    /* ── LEADERBOARD ── */
    .lb-wrap { background: var(--bg-card); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.5rem; }
    .lb-table { width: 100%; border-collapse: collapse; }
    .lb-table th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); padding: 8px 12px; text-align: left; border-bottom: 0.5px solid var(--border); }
    .lb-table th.num { text-align: right; }
    .lb-table td { padding: 10px 12px; border-bottom: 0.5px solid var(--border); font-size: 14px; vertical-align: middle; }
    .lb-table td.num { text-align: right; }
    .lb-table tr:last-child td { border-bottom: none; }
    .lb-table tr:hover td { background: var(--bg-card-2); }
    .lb-rank { font-size: 13px; color: var(--text-dim); font-weight: 600; }
    .lb-rank.gold { color: #F59E0B; }
    .lb-rank.silver { color: #94A3B8; }
    .lb-rank.bronze { color: #B45309; }
    .lb-name { font-weight: 500; font-size: 14px; }
    .lb-teams { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
    .lb-team { font-size: 12px; color: var(--text-muted); }
    .lb-team.elim { text-decoration: line-through; color: var(--text-dim); }
    .lb-pts { font-size: 18px; font-weight: 600; color: var(--accent); }
    .lb-wdl { font-size: 12px; color: var(--text-muted); }
    .h2h-section { margin-top: 2rem; }
    .h2h-card { background: var(--bg-card); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 10px; }
    .h2h-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 0.5px solid var(--border); }
    .h2h-players { font-size: 14px; font-weight: 500; }
    .h2h-pts { font-size: 12px; color: var(--text-muted); }
    .h2h-match { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
    .h2h-match:last-child { border-bottom: none; }
    .h2h-player { flex: 1; }
    .h2h-player-name { font-weight: 500; }
    .h2h-player-team { font-size: 12px; color: var(--text-muted); }
    .h2h-score { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--accent); min-width: 52px; text-align: center; }
    .h2h-score.pending { color: var(--text-dim); font-size: 12px; font-family: 'Inter', sans-serif; letter-spacing: 0; }
    .h2h-win { color: var(--green); }
    .h2h-lose { color: var(--text-dim); }
    .h2h-draw { color: var(--text-muted); }

    @media (max-width: 640px) {
      /* Layout */
      .container { padding: 1rem 0.875rem; }
      .site-header { padding: 0 0.875rem; height: 50px; }
      .logo { font-size: 18px; }

      /* Tabs — scrollable row, no wrap */
      .tabs { gap: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-wrap: nowrap; padding-bottom: 1px; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { padding: 8px 12px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }

      /* Enter screen */
      .enter-wrap { padding: 1rem 0; }
      .enter-hero { font-size: 36px; }
      .tier-explainer { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .input-row { flex-direction: column; }
      .btn { width: 100%; }
      .text-input { width: 100%; }

      /* Pick cards */
      .pick-card { padding: 0.75rem; gap: 10px; }
      .pick-flag { font-size: 22px; }
      .pick-name { font-size: 14px; }

      /* Stats row */
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-card { padding: 10px 8px; }
      .stat-num { font-size: 20px; }
      .stat-label { font-size: 11px; }

      /* Entries grid — single column */
      .entries-grid { grid-template-columns: 1fr; }

      /* Match cards */
      .match-card { flex-wrap: wrap; gap: 6px; padding: 10px 12px; }
      .match-date { min-width: auto; font-size: 11px; }
      .match-score { font-size: 16px; }

      /* Groups grid */
      .groups-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .group-card { padding: 0.75rem; }

      /* Leaderboard table — hide D/L columns, keep P/W/Pts */
      .lb-hide-mobile { display: none; }
      .lb-table td, .lb-table th { padding: 8px 8px; }
      .lb-pts { font-size: 16px; }
      .lb-teams { gap: 4px; }

      /* H2H */
      .h2h-card { padding: 0.75rem 0.875rem; }
      .h2h-score { font-size: 18px; min-width: 42px; }
      .h2h-player-name { font-size: 12px; }
      .h2h-player-team { font-size: 11px; }

      /* Admin */
      .admin-wrap { max-width: 100%; }
      .chk-grid { grid-template-columns: repeat(2, 1fr); gap: 5px; }
      .chk-item { font-size: 12px; padding: 6px 8px; }
    }

    /* ── FOOTER ── */
    .site-footer {
      border-top: 0.5px solid var(--border);
      padding: 1rem 1.5rem;
      margin-top: 3rem;
      display: flex;
      justify-content: center;
    }
    .footer-admin-btn {
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      color: var(--text-dim);
      background: none;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .footer-admin-btn:hover { color: var(--text-muted); border-color: var(--border-bright); }

    /* ── GROUP POINTS ── */
    .g-pts { font-size: 11px; font-weight: 600; color: var(--accent); min-width: 20px; text-align: right; }
    .g-team-owned { background: rgba(232,197,71,0.05); }

  </style>
</head>
<body>

<header class="site-header">
  <div class="logo">WC<span>2026</span> Sweepstake</div>
  <div class="live-dot" id="live-indicator">Loading</div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('enter')">My pick</button>
    <button class="tab" onclick="showTab('entries')">All entries</button>
    <button class="tab" onclick="showTab('leaderboard')">Leaderboard</button>
    <button class="tab" onclick="showTab('matches')">Matches</button>
    <button class="tab" onclick="showTab('groups')">Groups</button>
  </div>

  <div id="panel-enter" class="panel active"></div>
  <div id="panel-entries" class="panel"></div>
  <div id="panel-leaderboard" class="panel"></div>
  <div id="panel-matches" class="panel"></div>
  <div id="panel-groups" class="panel"></div>
  <div id="panel-admin" class="panel"></div>
</div>

<footer class="site-footer">
  <button class="footer-admin-btn" onclick="showAdmin()">⚙ Admin</button>
</footer>

// ── State ──

  allMatches: [],

function teamByName(name) { return TEAMS.find(t => t.name === name); }
function isElim(name) { return state.eliminated.includes(name); }
function initials(name) { return name.trim().split(/\s+/).map(w=>w[0]).join("").toUpperCase().slice(0,2); }
function fmtDate(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleDateString("en-GB", { day:"numeric", month:"short" });

// ── API calls ──
async function fetchEntries() {
  const r = await fetch("/.netlify/functions/get-entries");
  const d = await r.json();
  state.allEntries = d.entries || [];
}
async function fetchLive() {
  try {
    const r = await fetch("/.netlify/functions/live-data");
    const d = await r.json();
    state.allMatches = d.matches || [];
    const apiElim = d.eliminated || [];
    // Merge with any manual overrides stored in state
    state.eliminated = [...new Set([...apiElim, ...state.manualElim])];
    state.liveStatus = d.status;
    updateLiveIndicator();
  } catch {
    state.liveStatus = "error";
    updateLiveIndicator();
  }
}

function updateLiveIndicator() {
  const el = document.getElementById("live-indicator");
  if (!el) return;
  if (state.liveStatus === "live") {
    el.textContent = "Live";
    el.className = "live-dot live";
  } else if (state.liveStatus === "no_api_key") {
    el.textContent = "No API key";
    el.className = "live-dot";
  } else if (state.liveStatus === "api_error") {
    el.textContent = "Feed error";
    el.className = "live-dot";
  } else {
    el.textContent = "Loading";
    el.className = "live-dot";
  }
}

// ── Tab system ──
let activeTab = "enter";

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  const tabBtn = document.querySelector(`[onclick="showTab('${id}')"]`);
  if (tabBtn) tabBtn.classList.add("active");

  activeTab = id;
  renderTab(id);
}

function showAdmin() {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

// ── Enter tab ──
function renderEnter() {
  const el = document.getElementById("panel-enter");
  if (state.myName) {
    const entry = state.allEntries.find(e => e.name.toLowerCase() === state.myName.toLowerCase());
    if (entry) { renderMyPicks(el, entry); return; }
    // Name stored but entry not loaded yet
    el.innerHTML = `<div class="spinner"></div>`;
    return;
  }
  el.innerHTML = `
    <div class="enter-wrap">
      <div class="enter-hero">Pick your<br/><span>teams</span></div>
      <p class="enter-sub">Enter your name and we'll randomly draw one team from each tier for you. You can only enter once.</p>

        <div class="tier-pill t1">⭐ Top tier</div>
        <div class="tier-pill t2">● Mid tier</div>
        <div class="tier-pill t3">· Lower tier</div>
      </div>
      <div id="enter-alert"></div>
      <div class="input-row">
        <input class="text-input" type="text" id="name-input" placeholder="Your name" maxlength="40" />
        <button class="btn" id="draw-btn" onclick="doEnter()">Draw</button>
      </div>
    </div>
  `;
  document.getElementById("name-input").addEventListener("keydown", e => { if(e.key==="Enter") doEnter(); });
}

async function doEnter() {
  const input = document.getElementById("name-input");
  const name = input.value.trim();
  const alertEl = document.getElementById("enter-alert");

  if (!name) { alertEl.innerHTML = `<div class="alert alert-error">Please enter your name.</div>`; return; }

  document.getElementById("draw-btn").disabled = true;
  alertEl.innerHTML = "";

  const el = document.getElementById("panel-enter");
  el.innerHTML = `
    <div class="enter-wrap">
      <div class="draw-box">
        <div class="draw-title">Drawing your teams</div>
        <div class="draw-step"><div class="step-indicator active" id="si-1">↻</div><div class="step-label" id="sl-1">Picking from top tier…</div></div>
        <div class="draw-step"><div class="step-indicator" id="si-2">2</div><div class="step-label" id="sl-2">Mid tier up next</div></div>
        <div class="draw-step"><div class="step-indicator" id="si-3">3</div><div class="step-label" id="sl-3">Lower tier up next</div></div>
      </div>
    </div>
  `;

  try {
    const res = await fetch("/.netlify/functions/enter", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    const data = await res.json();

    if (!res.ok) {
      renderEnter();
      document.getElementById("enter-alert").innerHTML = `<div class="alert alert-error">${data.error || "Something went wrong"}</div>`;
      return;
    }

    // Animate through steps
    const teamObjs = data.teams.map(n => teamByName(n));
    let step = 0;
    function nextStep() {
      if (step >= 3) {
        localStorage.setItem("wc2026_name", data.name);
        state.myName = data.name;
        state.allEntries = state.allEntries.filter(e => e.name.toLowerCase() !== data.name.toLowerCase());
        state.allEntries.push({ name: data.name, teams: data.teams });
        setTimeout(() => {
          const entry = state.allEntries.find(e => e.name.toLowerCase() === data.name.toLowerCase());
          renderMyPicks(document.getElementById("panel-enter"), entry);
        }, 600);
        return;
      }
      const si = document.getElementById(`si-${step+1}`);
      const sl = document.getElementById(`sl-${step+1}`);
      if (si) { si.classList.remove("active"); si.classList.add("done"); si.textContent = "✓"; }
      if (sl) { sl.className = "step-label done"; sl.textContent = `${TIER_LABELS[step+1]}: ${teamObjs[step]?.flag} ${teamObjs[step]?.name}`; }
      step++;
      if (step < 3) {
        const next = document.getElementById(`si-${step+1}`);
        if (next) { next.classList.add("active"); next.textContent = "↻"; }
      }
      setTimeout(nextStep, step < 3 ? 750 : 900);
    }
    setTimeout(nextStep, 600);

  } catch {
    renderEnter();
    document.getElementById("enter-alert").innerHTML = `<div class="alert alert-error">Network error. Please try again.</div>`;
  }
}

function renderMyPicks(el, entry) {
  const teams = entry.teams.map(n => teamByName(n)).filter(Boolean);
  const allOut = teams.every(t => isElim(t.name));
  const anyOut = teams.some(t => isElim(t.name));

  el.innerHTML = `
    <div class="picks-header">
      <div class="picks-avatar">${initials(entry.name)}</div>
      <div>
        <div class="picks-name">${entry.name}</div>
        <div class="picks-sub">${allOut ? "All teams eliminated" : anyOut ? "Some teams still in" : "All teams still in"}</div>
      </div>
    </div>
    ${teams.map(t => {
      const elim = isElim(t.name);
      return `
        <div class="pick-card">
          <div class="pick-flag">${t.flag}</div>
          <div class="pick-info">
            <div class="pick-name ${elim ? "elim" : ""}">${t.name}</div>
            <div class="pick-group">Group ${t.group}</div>
          </div>
          <span class="tier-badge ${BADGE_CLASS[t.tier]}">${TIER_LABELS[t.tier]}</span>
          <span class="status-tag ${elim ? "status-out" : "status-in"}">${elim ? "Out" : "In"}</span>
        </div>
      `;
    }).join("")}
    ${allOut ? `<div class="alert alert-error" style="margin-top:1rem">All your teams are out — better luck next time!</div>` : ""}
    <p style="font-size:12px;color:var(--text-dim);margin-top:1rem">Not you? <a href="#" onclick="clearSession()" style="color:var(--text-muted)">Clear session</a></p>
  `;
}

function clearSession() {
  localStorage.removeItem("wc2026_name");

  renderEnter();
}

// ── Entries tab ──
function renderEntries() {
  const el = document.getElementById("panel-entries");
  const entries = state.allEntries;
  if (!entries.length) { el.innerHTML = `<div class="no-data">No entries yet.</div>`; return; }

  const total = entries.length;
  const active = entries.filter(e => {
    const teams = (e.teams || []).map(n => teamByName(n)).filter(Boolean);
    return teams.some(t => !isElim(t.name));
  }).length;
  const isAdmin = !!adminToken;

  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Entries</div></div>
      <div class="stat-card"><div class="stat-num">${active}</div><div class="stat-label">Still in</div></div>
      <div class="stat-card"><div class="stat-num">${total - active}</div><div class="stat-label">Eliminated</div></div>
    </div>
    ${isAdmin ? `<p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Admin mode — delete buttons visible.</p>` : `<p style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Enter your admin token in the Admin tab to enable delete.</p>`}
    <div class="section-label" style="margin-bottom:12px">All entries</div>
    <div class="entries-grid">
      ${[...entries].sort((a,b) => {
        const aIn = (a.teams||[]).map(n=>teamByName(n)).filter(Boolean).some(t=>!isElim(t.name));
        const bIn = (b.teams||[]).map(n=>teamByName(n)).filter(Boolean).some(t=>!isElim(t.name));
        return (bIn - aIn) || a.name.localeCompare(b.name);
      }).map(entry => {
        const teams = (entry.teams || []).map(n => teamByName(n)).filter(Boolean);
        const isIn = teams.some(t => !isElim(t.name));
        const safeName = entry.name.replace(/'/g, "\\'");
        return `
          <div class="entry-card ${isIn ? "" : "out"}" id="entry-${entry.name.replace(/\s+/g,'-')}">
            <div class="entry-top">
              <div class="e-avatar">${initials(entry.name)}</div>
              <div style="flex:1">
                <div class="e-name">${entry.name}</div>
                <div class="e-status">${isIn ? "Still in" : "Eliminated"}</div>
              </div>
              ${isAdmin ? `<button onclick="deleteEntry('${safeName}')" style="background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:18px;padding:0 4px;line-height:1" title="Delete entry">✕</button>` : ""}
            </div>
            <div class="e-teams">
              ${teams.map(t => {
                const elim = isElim(t.name);
                return `
                  <div class="e-team-row">
                    <span class="e-flag">${t.flag}</span>
                    <span class="e-tname ${elim ? "elim" : ""}">${t.name}</span>
                    <span class="tier-badge ${BADGE_CLASS[t.tier]}" style="font-size:10px">${t.tier===1?"⭐":t.tier===2?"●":"·"}</span>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }).join("")}
    </div>
    <div id="delete-alert" style="margin-top:1rem"></div>
  `;
}

async function deleteEntry(name) {
  if (!confirm(`Delete ${name}'s entry? This cannot be undone.`)) return;
  const alertEl = document.getElementById("delete-alert");
  try {
    const r = await fetch("/.netlify/functions/delete-entry", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, token: adminToken }),
    });
    const d = await r.json();
    if (!r.ok) {
      alertEl.innerHTML = `<div class="alert alert-error">${d.error || "Failed to delete."}</div>`;
      return;
    }
    // Remove from local state and re-render
    state.allEntries = state.allEntries.filter(e => e.name.toLowerCase() !== name.toLowerCase());
    // If it was the current user's session, clear it
    if (state.myName && state.myName.toLowerCase() === name.toLowerCase()) {
      localStorage.removeItem("wc2026_name");
      state.myName = null;
    }
    renderEntries();
    alertEl && (alertEl.innerHTML = `<div class="alert alert-success">${name}'s entry deleted.</div>`);
  } catch {
    alertEl.innerHTML = `<div class="alert alert-error">Network error. Try again.</div>`;
  }
}

// ── Matches tab ──
function fmtTime(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" });
  } catch { return ""; }
}

function fmtDateTime(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "Europe/London" })
      + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" });
  } catch { return ""; }
}

function renderMatches() {
  const el = document.getElementById("panel-matches");
  const matches = state.allMatches;

  if (!matches.length) {
    el.innerHTML = `
      <div class="no-data">
        No fixture data yet — check back shortly.<br/>
        <span style="font-size:12px">Data is fetched from API-Football and cached for 5 minutes.</span>
      </div>`;
    return;
  }

  const live = matches.filter(m => ["1H","2H","HT","ET","P","LIVE"].includes(m.status));
  const recent = matches.filter(m => ["FT","AET","PEN"].includes(m.status))
    .sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 16);
  const upcoming = matches.filter(m => m.status === "NS")
    .sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0, 32);

  // Group upcoming by date
  const upcomingByDate = {};
  upcoming.forEach(m => {
    const dateKey = new Date(m.date).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/London" });
    if (!upcomingByDate[dateKey]) upcomingByDate[dateKey] = [];
    upcomingByDate[dateKey].push(m);
  });

  function matchRow(m, showTime = false) {
    const isLive = ["1H","2H","HT","ET","P"].includes(m.status);
    const hasScore = m.homeGoals !== null && m.awayGoals !== null;
    const round = m.round ? `<span style="font-size:11px;color:var(--text-dim)">${m.round}</span>` : "";
    const venue = m.city ? `<span style="font-size:11px;color:var(--text-dim)">${m.city}</span>` : "";
    return `
      <div class="match-card">
        <div class="match-date">${showTime ? fmtTime(m.date) : fmtDate(m.date)}</div>
        <div class="match-teams" style="flex-direction:column;align-items:flex-start;gap:3px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="match-team">${m.homeTeam}</span>
            ${hasScore
              ? `<span class="match-score">${m.homeGoals}–${m.awayGoals}</span>`
              : `<span class="match-vs">vs</span>`}
            <span class="match-team">${m.awayTeam}</span>
          </div>
          <div style="display:flex;gap:8px">${round}${venue}</div>
        </div>
        <div class="match-status ${isLive ? "live-status" : ""}">${isLive ? "● LIVE" : m.status === "NS" ? "" : "FT"}</div>
      </div>
    `;
  }

  const upcomingHtml = Object.entries(upcomingByDate).map(([date, ms]) => `
    <div style="margin-bottom:1.5rem">
      <div style="font-size:12px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;padding-bottom:6px;border-bottom:0.5px solid var(--border)">${date}</div>
      ${ms.map(m => matchRow(m, true)).join("")}
    </div>
  `).join("");

  el.innerHTML = `
    ${live.length ? `<div class="matches-section"><h3>Live now</h3>${live.map(m => matchRow(m)).join("")}</div>` : ""}
    ${recent.length ? `<div class="matches-section"><h3>Recent results</h3>${recent.map(m => matchRow(m)).join("")}</div>` : ""}
    ${upcoming.length ? `<div class="matches-section"><h3>Upcoming fixtures</h3>${upcomingHtml}</div>` : ""}
  `;
}

// ── Groups tab ──
function calcTeamPoints() {
  // Returns map of team name -> { pts, w, d, l, gf, ga, played }
  const teamStats = {};
  TEAMS.forEach(t => { teamStats[t.name] = { pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, played: 0 }; });

  const finished = state.allMatches.filter(m => ["FT","AET","PEN"].includes(m.status) && m.homeGoals !== null);
  finished.forEach(m => {
    const h = teamStats[m.homeTeam];
    const a = teamStats[m.awayTeam];
    if (!h || !a) return;
    const hg = m.homeGoals, ag = m.awayGoals;
    h.played++; h.gf += hg; h.ga += ag;
    a.played++; a.gf += ag; a.ga += hg;
    if (hg > ag) { h.pts += 3; h.w++; a.l++; }
    else if (hg === ag) { h.pts += 1; h.d++; a.pts += 1; a.d++; }
    else { a.pts += 3; a.w++; h.l++; }
  });
  return teamStats;
}

function renderGroups() {
  const el = document.getElementById("panel-groups");
  const groups = {};
  TEAMS.forEach(t => { if (!groups[t.group]) groups[t.group] = []; groups[t.group].push(t); });

  const teamStats = calcTeamPoints();
  const hasResults = state.allMatches.some(m => ["FT","AET","PEN"].includes(m.status));

  // Build team owner map
  const teamOwner = {};
  state.allEntries.forEach(e => { (e.teams || []).forEach(t => { teamOwner[t] = e.name; }); });

  el.innerHTML = `
    <div class="section-label" style="margin-bottom:12px">All 48 teams · ⭐ top · ● mid · · lower${hasResults ? " · Pts shown" : ""}</div>
    <div class="groups-grid">
      ${Object.keys(groups).sort().map(g => {
        // Sort by points if we have results
        const groupTeams = hasResults
          ? [...groups[g]].sort((a, b) => {
              const sa = teamStats[a.name], sb = teamStats[b.name];
              return (sb.pts - sa.pts) || ((sb.gf - sb.ga) - (sa.gf - sa.ga)) || (sb.gf - sa.gf);
            })
          : groups[g];
        return `
        <div class="group-card">
          <div class="group-label" style="display:flex;justify-content:space-between">
            <span>Group ${g}</span>
            ${hasResults ? '<span style="font-size:10px;color:var(--text-dim)">Pts</span>' : ""}
          </div>
          ${groupTeams.map(t => {
            const s = teamStats[t.name];
            const owned = teamOwner[t.name];
            const elim = isElim(t.name);
            return `
              <div class="g-team ${owned ? "g-team-owned" : ""}">
                <span class="g-flag">${t.flag}</span>
                <span class="g-name ${elim ? "elim" : ""}">${t.name}</span>
                ${owned ? `<span style="font-size:10px;color:var(--accent);opacity:0.7" title="${owned}">●</span>` : ""}
                <span class="g-tier">${t.tier===1?"⭐":t.tier===2?"●":"·"}</span>
                ${hasResults ? `<span class="g-pts">${s.played > 0 ? s.pts : "—"}</span>` : ""}
              </div>
            `;
          }).join("")}
        </div>`;
      }).join("")}
    </div>
    <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem;font-size:12px;color:var(--text-dim)">
      <span>Official FIFA draw, 5 Dec 2025</span>
      ${teamOwner && Object.keys(teamOwner).length ? '<span>· <span style="color:var(--accent)">●</span> = team is picked</span>' : ""}
      ${hasResults ? "<span>· Sorted by points</span>" : ""}
    </div>
  `;
}

// ── Admin tab ──
let adminToken = sessionStorage.getItem("wc2026_admin") || "";

function renderAdmin() {
  const el = document.getElementById("panel-admin");
  el.innerHTML = `
    <div class="admin-wrap">
      <p class="admin-hint">This panel lets you manually mark teams as eliminated during the group stage, before the API can track it automatically. Set your ADMIN_TOKEN in Netlify environment variables.</p>
      <div class="admin-token-row">
        <input class="text-input" type="password" id="admin-token-input" placeholder="Admin token" value="${adminToken}" style="max-width:260px" />
        <button class="btn" onclick="saveToken()">Save token</button>
      </div>
      <div id="admin-alert"></div>
      <div style="margin-bottom:1rem">
        <button class="btn" style="background:var(--bg-card-2);color:var(--text);border:0.5px solid var(--border-bright)" onclick="loadAdminElim()">Load current eliminated teams</button>
      </div>
      <div id="admin-team-section"></div>
    </div>
  `;
}

function saveToken() {
  adminToken = document.getElementById("admin-token-input").value.trim();
  sessionStorage.setItem("wc2026_admin", adminToken);
  document.getElementById("admin-alert").innerHTML = `<div class="alert alert-success">Token saved for this session.</div>`;
}

async function loadAdminElim() {
  const alertEl = document.getElementById("admin-alert");
  if (!adminToken) { alertEl.innerHTML = `<div class="alert alert-error">Enter your admin token first.</div>`; return; }

  try {
    const r = await fetch("/.netlify/functions/admin", { headers: { Authorization: `Bearer ${adminToken}` } });
    if (r.status === 401) { alertEl.innerHTML = `<div class="alert alert-error">Invalid token.</div>`; return; }
    const d = await r.json();
    const currentElim = d.teams || [];
    renderAdminTeams(currentElim);
  } catch { alertEl.innerHTML = `<div class="alert alert-error">Failed to load. Check your token and try again.</div>`; }
}

function renderAdminTeams(currentElim) {
  const sec = document.getElementById("admin-team-section");
  sec.innerHTML = `
    <div class="section-label" style="margin-bottom:8px">Mark eliminated teams</div>
    <div class="team-checkbox-grid">
      ${TEAMS.map(t => `
        <label class="team-check">
          <input type="checkbox" value="${t.name}" ${currentElim.includes(t.name) ? "checked" : ""} />
          ${t.flag} ${t.name}
        </label>
      `).join("")}
    </div>
    <button class="btn" onclick="saveElim()">Save eliminated teams</button>
    <div id="admin-save-alert" style="margin-top:10px"></div>
  `;
}

async function saveElim() {
  const checked = [...document.querySelectorAll("#admin-team-section input[type=checkbox]:checked")].map(c => c.value);
  const alertEl = document.getElementById("admin-save-alert");
  try {
    const r = await fetch("/.netlify/functions/admin", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${adminToken}` },
      body: JSON.stringify({ teams: checked }),
    });
    if (r.status === 401) { alertEl.innerHTML = `<div class="alert alert-error">Invalid token.</div>`; return; }
    state.manualElim = checked;
    state.eliminated = [...new Set([...state.eliminated, ...checked])];
    alertEl.innerHTML = `<div class="alert alert-success">Saved ${checked.length} eliminated team(s).</div>`;
    // Re-render other tabs if open
  } catch { alertEl.innerHTML = `<div class="alert alert-error">Failed to save.</div>`; }
}


// ── Leaderboard & Head to Head ──
function calcLeaderboard() {
  const entries = state.allEntries;
  const matches = state.allMatches.filter(m => ["FT","AET","PEN"].includes(m.status) && m.homeGoals !== null);

  // Build map: team name -> player name
  const teamOwner = {};
  entries.forEach(e => { (e.teams || []).forEach(t => { teamOwner[t] = e.name; }); });

  // Per-player stats
  const stats = {};
  entries.forEach(e => {
    stats[e.name] = { pts: 0, w: 0, d: 0, l: 0, played: 0 };
  });

  // Head to head matchups: key = "playerA|playerB" sorted, value = array of match results
  const h2h = {};

  matches.forEach(m => {
    const homeOwner = teamOwner[m.homeTeam];
    const awayOwner = teamOwner[m.awayTeam];
    const hg = m.homeGoals;
    const ag = m.awayGoals;

    const isH2H = homeOwner && awayOwner && homeOwner !== awayOwner;

    // Award points to home team owner
    if (homeOwner && stats[homeOwner]) {
      stats[homeOwner].played++;
      if (hg > ag) {
        stats[homeOwner].pts += 3;
        stats[homeOwner].w++;
        // +2 bonus for beating another player's team directly
        if (isH2H) stats[homeOwner].pts += 2;
      }
      else if (hg === ag) { stats[homeOwner].pts += 1; stats[homeOwner].d++; }
      else { stats[homeOwner].l++; }
    }

    // Award points to away team owner
    if (awayOwner && stats[awayOwner]) {
      stats[awayOwner].played++;
      if (ag > hg) {
        stats[awayOwner].pts += 3;
        stats[awayOwner].w++;
        // +2 bonus for beating another player's team directly
        if (isH2H) stats[awayOwner].pts += 2;
      }
      else if (ag === hg) { stats[awayOwner].pts += 1; stats[awayOwner].d++; }
      else { stats[awayOwner].l++; }
    }

    // If both teams are owned by different players, record h2h
    if (isH2H) {
      const key = [homeOwner, awayOwner].sort().join("|");
      if (!h2h[key]) h2h[key] = { players: [homeOwner, awayOwner].sort(), matches: [] };
      h2h[key].matches.push({
        homeTeam: m.homeTeam, awayTeam: m.awayTeam,
        homeOwner, awayOwner,
        homeGoals: hg, awayGoals: ag,
        date: m.date, round: m.round,
      });
    }
  });

  // Also include upcoming h2h (NS matches between owned teams)
  const upcoming = state.allMatches.filter(m => m.status === "NS");
  upcoming.forEach(m => {
    const homeOwner = teamOwner[m.homeTeam];
    const awayOwner = teamOwner[m.awayTeam];
    if (homeOwner && awayOwner && homeOwner !== awayOwner) {
      const key = [homeOwner, awayOwner].sort().join("|");
      if (!h2h[key]) h2h[key] = { players: [homeOwner, awayOwner].sort(), matches: [] };
      h2h[key].matches.push({
        homeTeam: m.homeTeam, awayTeam: m.awayTeam,
        homeOwner, awayOwner,
        homeGoals: null, awayGoals: null,
        date: m.date, round: m.round, pending: true,
      });
    }
  });

  // Sort leaderboard: pts desc, then w desc, then name
  const sorted = Object.entries(stats)
    .map(([name, s]) => ({ name, ...s }))
    .sort((a, b) => b.pts - a.pts || b.w - a.w || a.name.localeCompare(b.name));

  return { sorted, h2h };
}

function renderLeaderboard() {
  const el = document.getElementById("panel-leaderboard");
  const entries = state.allEntries;

  if (!entries.length) {
    el.innerHTML = `<div class="no-data">No entries yet.</div>`;
    return;
  }

  const hasMatches = state.allMatches.some(m => ["FT","AET","PEN"].includes(m.status));
  const { sorted, h2h } = calcLeaderboard();

  // Build team owner map for display
  const teamOwner = {};
  entries.forEach(e => { (e.teams || []).forEach(t => { teamOwner[t] = e.name; }); });

  const rankClass = (i) => i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
  const rankLabel = (i) => i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1;

  el.innerHTML = `
    <div class="section-label" style="margin-bottom:10px">Points table</div>
    <p style="font-size:12px;color:var(--text-muted);margin-bottom:1rem">Win = 3pts · Draw = 1pt · Loss = 0pts · Head to head win = +2 bonus pts${!hasMatches ? " · Leaderboard updates as matches are played" : ""}</p>
    <div class="lb-wrap">
      <table class="lb-table">
        <thead>
          <tr>
            <th style="width:32px">#</th>
            <th>Player</th>
            <th class="num">Pts</th>
            <th class="num">P</th>
            <th class="num">W</th>
            <th class="num lb-hide-mobile">D</th>
            <th class="num lb-hide-mobile">L</th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map((p, i) => {
            const entry = entries.find(e => e.name === p.name);
            const teams = (entry?.teams || []).map(n => teamByName(n)).filter(Boolean);
            return `
              <tr>
                <td><span class="lb-rank ${rankClass(i)}">${rankLabel(i)}</span></td>
                <td>
                  <div class="lb-name">${p.name}</div>
                  <div class="lb-teams">
                    ${teams.map(t => `<span class="lb-team ${isElim(t.name) ? "elim" : ""}">${t.flag} ${t.name}</span>`).join("")}
                  </div>
                </td>
                <td class="num"><span class="lb-pts">${p.pts}</span></td>
                <td class="num"><span class="lb-wdl">${p.played}</span></td>
                <td class="num"><span class="lb-wdl">${p.w}</span></td>
                <td class="num lb-hide-mobile"><span class="lb-wdl">${p.d}</span></td>
                <td class="num lb-hide-mobile"><span class="lb-wdl">${p.l}</span></td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>

    ${Object.keys(h2h).length ? `
      <div class="h2h-section">
        <div class="section-label" style="margin-bottom:10px">Head to head</div>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:1rem">Fixtures where two players' teams face each other directly.</p>
        ${Object.values(h2h).map(clash => {
          const p1 = clash.players[0];
          const p2 = clash.players[1];

          // Calc h2h points (win = 3+2 bonus, draw = 1 each, loss = 0)
          let p1pts = 0, p2pts = 0;
          clash.matches.filter(m => !m.pending).forEach(m => {
            const hg = m.homeGoals, ag = m.awayGoals;
            const homeIsP1 = m.homeOwner === p1;
            const p1g = homeIsP1 ? hg : ag;
            const p2g = homeIsP1 ? ag : hg;
            if (p1g > p2g) { p1pts += 5; }       // 3 + 2 h2h bonus
            else if (p1g === p2g) { p1pts += 1; p2pts += 1; }
            else { p2pts += 5; }                   // 3 + 2 h2h bonus
          });

          return `
            <div class="h2h-card">
              <div class="h2h-top">
                <div class="h2h-players">${p1} vs ${p2}</div>
                <div class="h2h-pts">${p1pts}–${p2pts} pts</div>
              </div>
              ${clash.matches.map(m => {
                const hg = m.homeGoals, ag = m.awayGoals;
                const finished = !m.pending;
                const homeWin = finished && hg > ag;
                const awayWin = finished && ag > hg;
                const homeOwnerIsLeft = m.homeOwner === p1 || (m.awayOwner !== p1);
                return `
                  <div class="h2h-match">
                    <div class="h2h-player" style="text-align:left">
                      <div class="h2h-player-name ${finished ? (homeWin ? "h2h-win" : awayWin ? "h2h-lose" : "h2h-draw") : ""}">${m.homeOwner}</div>
                      <div class="h2h-player-team">${teamByName(m.homeTeam)?.flag || ""} ${m.homeTeam}</div>
                    </div>
                    ${finished
                      ? `<div class="h2h-score">${hg}–${ag}</div>`
                      : `<div class="h2h-score pending">${fmtDate(m.date)}</div>`}
                    <div class="h2h-player" style="text-align:right">
                      <div class="h2h-player-name ${finished ? (awayWin ? "h2h-win" : homeWin ? "h2h-lose" : "h2h-draw") : ""}">${m.awayOwner}</div>
                      <div class="h2h-player-team">${m.awayTeam} ${teamByName(m.awayTeam)?.flag || ""}</div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        }).join("")}
      </div>
    ` : `<div class="no-data" style="padding:2rem 0">No head to head matchups yet — check back once games are played.</div>`}
  `;
}

  renderTab(activeTab);
  // Refresh every 5 mins
  setInterval(async () => {
    await Promise.all([fetchEntries(), fetchLive()]);
    renderTab(activeTab);
  }, 5 * 60 * 1000);
}

init();
